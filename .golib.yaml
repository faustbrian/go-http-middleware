schema_version: 1
tool_version: v1.0.4
tool_checksums_sha256: 6c1ee70e3fa7aa333d12420dc78d7740f4de78717d1979eeb8a5f70a2a124ba0
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: go-doc
      path: api/baseline.txt
      packages:
        - .
        - ./adapter
        - ./admission
        - ./bodylimit
        - ./compress
        - ./content
        - ./cors
        - ./deadline
        - ./internal/httpx
        - ./middlewaretest
        - ./observe
        - ./proxy
        - ./recovery
        - ./requestid
        - ./responsepolicy
        - ./secureheader
operations:
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: interoperability
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzDescriptorNames$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./requestid]
        fuzz: '^FuzzInboundIdentifier$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./bodylimit]
        fuzz: '^FuzzBodyLimit$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./proxy]
        fuzz: '^FuzzForwardedField$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./cors]
        fuzz: '^FuzzOriginAndPreflight$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./compress]
        fuzz: '^FuzzAcceptEncoding$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./content]
        fuzz: '^FuzzAcceptMediaTypes$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./secureheader]
        fuzz: '^FuzzConfiguredHeaderValues$'
        budget: 10000x
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [.]
        benchmark: Benchmark
        budget: 100ms
        timeout: 20m
